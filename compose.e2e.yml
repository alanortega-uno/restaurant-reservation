name: restaurant_reservations_e2e

services:
  mariadb:
    image: mariadb:latest
    volumes:
      - restaurant-reservations-mariadb-data:/var/lib/mariadb
    environment:
      MARIADB_ROOT_PASSWORD: Control123
      MARIADB_DATABASE: restaurant_reservations_tests
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
  api:
    image: node:16-alpine
    environment:
      NODE_ENV: e2e
      DB_NAME: restaurant_reservations_tests
      PORT: 3000
      ACCESS_TOKEN_SECRET: 
      REFRESH_TOKEN_SECRET: 
      DB_TYPE: mariadb
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: Control123
      ALLOWED_ORIGIN_2: http://app:4200
    command: >
      sh -c "apk add --update curl && 
            rm -rf /var/cache/apk/* &&
            npm i &&
            npm run e2e:typeorm:migrate -w @restaurant-reservation/api &&
            npm run e2e:dev -w @restaurant-reservation/api"
    ports:
      - 3000:3000
    working_dir: /app
    volumes:
      - ./:/app
    depends_on:
      mariadb:
        condition: service_healthy
    links:
      - mariadb
    healthcheck:
      test: ["CMD", "curl", "--fail", "-G", "http://localhost:3000/api/docs/"]
      interval: 30s
      timeout: 10s
      retries: 30
  app:
    image: node:16-alpine
    command: >
      sh -c "apk add --update curl && 
      rm -rf /var/cache/apk/* && 
      npm i &&
      npm run e2e:dev -w @restaurant-reservation/app"
    ports:
      - 4200:4200
    working_dir: /app
    volumes:
      - ./:/app
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "-G", "http://localhost:4200"]
      interval: 30s
      timeout: 10s
      retries: 30
  e2e:
    image: cypress/included:13.13.2
    working_dir: /tests
    volumes:
      - ./packages/app/:/tests
    depends_on:
      api:
        condition: service_healthy
      app:
        condition: service_healthy
volumes:
  restaurant-reservations-mariadb-data:
